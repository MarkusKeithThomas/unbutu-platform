# CI: mỗi PR và mỗi push lên main → build, chạy toàn bộ test, build Docker image (không push).
name: CI

# Thay đổi KHÔNG ảnh hưởng image/deploy prod → bỏ qua CI. Release (workflow_run của CI trên main) và Deploy
# cũng không chạy → merge tài liệu không tốn build. Commit có lẫn file khác vẫn chạy đầy đủ.
#   - *.md, docs/: tài liệu
#   - deploy/signoz/, compose.observability.yml: SigNoz do admin dựng tay (docs/runbooks/signoz.md), deploy.sh không dùng
#   - compose.local.yml: chỉ dùng ở máy dev
# Lưu ý khi bật branch protection: nếu bắt buộc check "Build & test", PR chỉ có docs sẽ kẹt "pending" → cần xử lý (vd. job rỗng).
on:
  pull_request:
    paths-ignore: &paths-ignore
      - '**/*.md'
      - 'docs/**'
      - 'deploy/signoz/**'
      - 'deploy/compose.observability.yml'
      - 'deploy/compose.local.yml'
  push:
    branches: [main]
    paths-ignore: *paths-ignore

# Token của workflow chỉ được đọc code – nguyên tắc quyền tối thiểu.
permissions:
  contents: read

# PR: push liên tiếp → huỷ lần chạy cũ, chỉ chạy bản mới nhất.
# main: KHÔNG huỷ – mỗi commit trên main phải có kết quả xanh/đỏ riêng (release deploy theo SHA).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cài Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Cache thư viện + build cache của Gradle giữa các lần chạy.
      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v6

      # Gồm cả integration test dùng Postgres thật (Testcontainers – máy CI có sẵn Docker).
      - name: Build + test
        run: ./gradlew build

      - name: Lưu báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      # Chỉ kiểm tra Dockerfile build được; image :ci bị bỏ đi.
      # Image đem deploy do release.yml build ĐÚNG MỘT LẦN (ghcr.io/...:<sha>); prod deploy
      # theo digest của image đó, không build lại (ARCHITECTURE.md §6.2).
      - name: Build Docker image cho mọi service
        run: |
          for dir in services/*/; do
            svc=$(basename "$dir")
            [ -f "$dir/build.gradle.kts" ] || continue   # bỏ qua service chưa có code
            echo "::group::docker build $svc"
            docker build -f deploy/docker/service.Dockerfile --build-arg SERVICE="$svc" -t "$svc:ci" .
            echo "::endgroup::"
          done
