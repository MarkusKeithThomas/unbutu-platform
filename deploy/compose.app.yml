# Compose trên SERVER cho môi trường prod (không có staging – ADR-0003). KHÔNG chạy tay – dùng deploy.sh:
#   sudo /opt/unbutu-platform/bin/deploy.sh <images.env>
#
# images.env    : image từng service THEO DIGEST (ghcr.io/...@sha256:...) + APP_VERSION – do release.yml tạo
# env/<svc>.env : biến môi trường từng service – deploy.sh sinh từ AWS lúc deploy (ADR-0004):
#                 SSM /unbutu/prod/<svc>/env-map (đường dẫn, repo pro-ticket-workload) + Secrets Manager (value)
#                 root:root 600, không commit, không sửa tay.
#
# Khác compose.local.yml: không build, không mở port service ra máy; chỉ gateway bind 127.0.0.1:8080
# (Tailscale Funnel → Internet).

# Log json-file (giống daemon.json) + gắn label compose vào mỗi dòng ("attrs") để OTel Collector của SigNoz
# biết dòng log thuộc service/project nào (deploy/signoz/ingester/ingester.yaml, ADR-0006).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.project,com.docker.compose.service"

x-service: &service
  restart: unless-stopped
  mem_limit: 512m
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    env_file:                       # POSTGRES_USER, POSTGRES_PASSWORD, SERVICE_DATABASES, <SVC>_DB_PASSWORD
      - path: env/postgres.env
        format: raw                 # value giữ nguyên, không diễn giải $ hay dấu nháy
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-service:
    <<: *service
    image: ${CATALOG_SERVICE_IMAGE:?Thiếu CATALOG_SERVICE_IMAGE trong images.env}
    env_file:
      - path: env/catalog-service.env
        format: raw
    environment:
      APP_VERSION: ${APP_VERSION:-unknown}

  api-gateway:
    <<: *service
    image: ${API_GATEWAY_IMAGE:?Thiếu API_GATEWAY_IMAGE trong images.env}
    depends_on: {}
    env_file:
      - path: env/api-gateway.env
        format: raw
    environment:
      APP_VERSION: ${APP_VERSION:-unknown}
    ports:
      - "127.0.0.1:8080:8080"       # Tailscale Funnel → Internet

volumes:
  pgdata:
