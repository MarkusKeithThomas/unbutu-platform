# Compose trên SERVER cho môi trường prod (không có staging – ADR-0003). KHÔNG chạy tay – dùng deploy.sh:
#   sudo /opt/unbutu-platform/bin/deploy.sh <images.env>
#
# images.env    : image từng service THEO DIGEST (ghcr.io/...@sha256:...) + APP_VERSION – do release.yml tạo
# env/<svc>.env : biến môi trường từng service – deploy.sh sinh từ AWS lúc deploy (ADR-0004):
#                 SSM /unbutu/prod/<svc>/env-map (đường dẫn, repo pro-ticket-workload) + Secrets Manager (value)
#                 root:root 600, không commit, không sửa tay.
#
# Khác compose.local.yml: không build, không mở port service ra máy; chỉ gateway bind 127.0.0.1:8080
# (Tailscale Funnel → Internet).

# Log json-file (giống daemon.json) + gắn label compose vào mỗi dòng ("attrs") để OTel Collector của SigNoz
# biết dòng log thuộc service/project nào (deploy/signoz/ingester/ingester.yaml, ADR-0006).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.project,com.docker.compose.service"

# Observability của service Java (ADR-0006, OBS-4) – cấu hình hạ tầng chung, không phải secret.
#  - OpenTelemetry Java agent (có sẵn trong image, Dockerfile) → trace + metrics JVM/HTTP gửi OTLP tới collector của SigNoz
#    qua network `telemetry` (alias otel-collector). Log KHÔNG gửi qua OTLP: vẫn ra stdout, collector đọc log Docker.
#  - Log stdout dạng JSON ECS (Spring Boot structured logging); agent gắn trace_id/span_id vào MDC.
x-otel-env: &otel-env
  JDK_JAVA_OPTIONS: -javaagent:/opt/otel/opentelemetry-javaagent.jar
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_LOGS_EXPORTER: none
  OTEL_METRIC_EXPORT_INTERVAL: "30000"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=prod,service.version=${APP_VERSION:-unknown}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  LOGGING_STRUCTURED_ECS_SERVICE_VERSION: ${APP_VERSION:-unknown}
  LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: prod
  APP_VERSION: ${APP_VERSION:-unknown}

x-service: &service
  restart: unless-stopped
  mem_limit: 512m
  logging: *logging
  networks: [default, telemetry]
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    env_file:                       # POSTGRES_USER, POSTGRES_PASSWORD, SERVICE_DATABASES, <SVC>_DB_PASSWORD
      - path: env/postgres.env
        format: raw                 # value giữ nguyên, không diễn giải $ hay dấu nháy
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Event log (Kafka API) – ADR-0007. 1 node, 1 core. Chế độ production: có fsync + kiểm tra hệ thống;
  # Redpanda đòi ≥ 1 GB/core ở chế độ này (--memory là trần cấp phát; đo thực tế ~100 MB khi tải nhẹ).
  # Không env_file (không cần secret) → deploy.sh không cần env-map. Chỉ trong network nội bộ, không publish port.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.10
    restart: unless-stopped
    mem_limit: 1280m
    logging: *logging
    # Image mặc định bật developer_mode (= bỏ fsync, mất điện có thể hỏng dữ liệu) → tắt trước khi start.
    # auto_create_topics_enabled mặc định false (topic do producer khai báo).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        rpk redpanda config set redpanda.developer_mode false &&
        exec rpk redpanda start --smp=1 --memory=1G --reserve-memory=0M --overprovisioned
        --kafka-addr=internal://0.0.0.0:9092 --advertise-kafka-addr=internal://redpanda:9092 --default-log-level=warn
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  catalog-service:
    <<: *service
    image: ${CATALOG_SERVICE_IMAGE:?Thiếu CATALOG_SERVICE_IMAGE trong images.env}
    env_file:
      - path: env/catalog-service.env
        format: raw
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: catalog-service

  identity-service:
    <<: *service
    image: ${IDENTITY_SERVICE_IMAGE:?Thiếu IDENTITY_SERVICE_IMAGE trong images.env}
    env_file:
      - path: env/identity-service.env
        format: raw
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: identity-service

  # UI tĩnh (nginx). Không phải Java → không dùng otel-env; gateway route mọi path không phải /api/** vào đây.
  frontend:
    <<: *service
    image: ${FRONTEND_IMAGE:?Thiếu FRONTEND_IMAGE trong images.env}
    mem_limit: 64m
    depends_on: {}
    env_file:
      - path: env/frontend.env
        format: raw
    healthcheck:
      # 127.0.0.1, KHÔNG dùng localhost: trong image Alpine localhost → ::1 (IPv6), nginx chỉ nghe IPv4 → luôn unhealthy
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  api-gateway:
    <<: *service
    image: ${API_GATEWAY_IMAGE:?Thiếu API_GATEWAY_IMAGE trong images.env}
    depends_on: {}
    env_file:
      - path: env/api-gateway.env
        format: raw
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: api-gateway
    ports:
      - "127.0.0.1:8080:8080"       # Tailscale Funnel → Internet

networks:
  # Do project `observability` tạo (compose.observability.yml). external → deploy prod KHÔNG tạo/xoá nó.
  # Server mới: `docker network create telemetry` trước lần deploy đầu (docs/runbooks/signoz.md bước 0).
  telemetry:
    external: true

volumes:
  pgdata:
  redpanda-data:
