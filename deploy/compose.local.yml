# Chạy hệ thống trong container trên máy dev (mỗi service = 1 container, giống server).
# Trước khi up: build jar →  ./gradlew build
# Chạy:                      docker compose -f deploy/compose.local.yml up --build -d   (hoặc: make up)
# Mỗi service mở 1 port cố định trên 127.0.0.1 (bảng port: README.md → "Chạy local").
# Quy tắc depends_on: service chỉ phụ thuộc HẠ TẦNG (postgres, rabbitmq...), không phụ thuộc service khác
# → `make ide` tắt được bất kỳ service nào để chạy nó trong IntelliJ.
# Mật khẩu ở đây CHỈ dùng cho local; server dùng file .env riêng, không commit.
name: ticket-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Mỗi service 1 user + 1 database (xem postgres/init/01-create-service-databases.sh)
      SERVICE_DATABASES: catalog identity inventory booking payment notification loadtest
      CATALOG_DB_PASSWORD: catalog
      IDENTITY_DB_PASSWORD: identity
      INVENTORY_DB_PASSWORD: inventory
      BOOKING_DB_PASSWORD: booking
      PAYMENT_DB_PASSWORD: payment
      NOTIFICATION_DB_PASSWORD: notification
      LOADTEST_DB_PASSWORD: loadtest
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # để xem DB bằng IntelliJ/DBeaver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Event log (Kafka API). Listener "external" cho service chạy trong IntelliJ: localhost:19092.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.10
    # Local: GIỮ developer_mode của image (bỏ fsync, cho chạy với 512 MB) – mất dữ liệu local không sao.
    # Prod (compose.app.yml) tắt developer_mode. auto_create_topics_enabled mặc định false ở cả hai.
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --default-log-level=warn
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "",
              "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  inventory-service:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: inventory-service
    image: inventory-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
    ports:
      - "127.0.0.1:8083:8080"   # port cố định của inventory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  payment-service:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: payment-service
    image: payment-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment
      DB_PASSWORD: payment
      PUBLIC_BASE_URL: http://localhost:8080                           # trình duyệt quay về qua gateway
      UI_BASE_URL: ${UI_BASE_URL:-http://localhost:8080}
      # Luyện sự cố (mặc định happy case): export trước `make up s=payment-service`, vd. MOCK_FAULT_IPN_DROP_RATE=1
      # Danh sách + ý nghĩa: services/payment-service/README.md → "Lỗi giả lập".
      MOCK_FAULT_IPN_DROP_RATE: ${MOCK_FAULT_IPN_DROP_RATE:-0}
      MOCK_FAULT_IPN_DELAY: ${MOCK_FAULT_IPN_DELAY:-0s}
      MOCK_FAULT_IPN_DUPLICATE_RATE: ${MOCK_FAULT_IPN_DUPLICATE_RATE:-0}
      MOCK_FAULT_IPN_NETWORK_ERROR_RATE: ${MOCK_FAULT_IPN_NETWORK_ERROR_RATE:-0}
      MOCK_FAULT_IPN_BAD_SIGNATURE_RATE: ${MOCK_FAULT_IPN_BAD_SIGNATURE_RATE:-0}
      MOCK_FAULT_IPN_WRONG_AMOUNT_RATE: ${MOCK_FAULT_IPN_WRONG_AMOUNT_RATE:-0}
      MOCK_FAULT_BANK_PENDING_RATE: ${MOCK_FAULT_BANK_PENDING_RATE:-0}
      MOCK_FAULT_BANK_PENDING_DURATION: ${MOCK_FAULT_BANK_PENDING_DURATION:-3m}
      MOCK_FAULT_QUERYDR_ERROR_RATE: ${MOCK_FAULT_QUERYDR_ERROR_RATE:-0}
      MOCK_IPN_RETRY_BACKOFF: ${MOCK_IPN_RETRY_BACKOFF:-10s,30s,60s,120s,300s}
      PAYMENT_RECONCILE_INTERVAL: ${PAYMENT_RECONCILE_INTERVAL:-1m}
      PAYMENT_RECONCILE_PENDING_AFTER: ${PAYMENT_RECONCILE_PENDING_AFTER:-2m}
      PAYMENT_RECONCILE_ABANDON_AFTER: ${PAYMENT_RECONCILE_ABANDON_AFTER:-2m}
    ports:
      - "127.0.0.1:8085:8080"   # port cố định của payment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  booking-service:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: booking-service
    image: booking-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booking_db
      DB_USERNAME: booking
      DB_PASSWORD: booking
      IDENTITY_JWKS_URI: ${IDENTITY_SERVICE_URL:-http://identity-service:8080}/.well-known/jwks.json
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:8080}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8084:8080"   # port cố định của booking
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  notification-service:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: notification-service
    image: notification-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: notification
      DB_PASSWORD: notification
      IDENTITY_JWKS_URI: ${IDENTITY_SERVICE_URL:-http://identity-service:8080}/.well-known/jwks.json
      NOTIFICATION_QR_ALLOW_EPHEMERAL_KEY: "true"   # local: khoá ký QR tạm (prod: QR_SIGNING_KEY từ AWS SM)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8086:8080"   # port cố định của notification
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  # Nút bấm load test (/admin/loadtest). Image có k6 (target runtime-k6). Local bắn vào api-gateway trong network.
  loadtest-service:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      target: runtime-k6
      args:
        SERVICE: loadtest-service
    image: loadtest-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loadtest_db
      DB_USERNAME: loadtest
      DB_PASSWORD: loadtest
      IDENTITY_JWKS_URI: ${IDENTITY_SERVICE_URL:-http://identity-service:8080}/.well-known/jwks.json
      LOADTEST_TARGET_URL: http://api-gateway:8080
      LOADTEST_MAX_RPS: "300"               # máy dev
      LOADTEST_ACCOUNT_PASSWORD: loadtest-pass-123   # chỉ local (prod: AWS SM)
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8080}
      BOOKING_SERVICE_URL: ${BOOKING_SERVICE_URL:-http://booking-service:8080}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+ExitOnOutOfMemoryError
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8087:8080"   # port cố định của loadtest
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1

  catalog-service:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: catalog-service
    image: catalog-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: catalog
      DB_PASSWORD: catalog
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed-local   # + dữ liệu mẫu (prod không có)
      # Public key verify access token. `make ide s=identity-service` → http://host.docker.internal:8081
      IDENTITY_JWKS_URI: ${IDENTITY_SERVICE_URL:-http://identity-service:8080}/.well-known/jwks.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8080"   # port cố định của catalog (service chạy trong IntelliJ gọi vào đây)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  identity-service:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: identity-service
    image: identity-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: identity
      DB_PASSWORD: identity
      IDENTITY_JWT_ALLOW_EPHEMERAL_KEY: "true"   # local: key RSA tạm (prod: JWT_PRIVATE_KEY từ AWS SM)
      IDENTITY_REFRESH_COOKIE_SECURE: "false"    # http://localhost
      # Login Google (tuỳ chọn): export trong shell trước `make up` – KHÔNG ghi value vào file này.
      # Redirect URI khai báo ở Google Console: http://localhost:8080/api/identity/login/oauth2/code/google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UI_BASE_URL: ${UI_BASE_URL:-http://localhost:8080}   # UI qua gateway; dùng `npm run dev` thì đặt http://localhost:5173
    ports:
      - "127.0.0.1:8081:8080"   # port cố định của identity
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  # UI xem Kafka (topic, message, consumer group + lag, DLT) – http://localhost:8091. Local: cho phép thao tác
  # (reset offset, gửi message thử); prod chỉ đọc (compose.app.yml, ADR-0008).
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: DISABLED
    ports:
      - "127.0.0.1:8091:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  frontend:
    build:
      context: ../frontend
    image: frontend:local
    ports:
      - "127.0.0.1:8090:8080"   # xem trực tiếp nginx (bình thường vào qua gateway http://localhost:8080)
    healthcheck:
      # 127.0.0.1, KHÔNG dùng localhost: trong image Alpine localhost → ::1 (IPv6), nginx chỉ nghe IPv4 → luôn unhealthy
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m

  api-gateway:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: api-gateway
    image: api-gateway:local
    environment:
      # `make ide s=catalog-service` đặt biến này = http://host.docker.internal:8082 (catalog chạy trong IntelliJ)
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8080}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8080}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:8080}
      BOOKING_SERVICE_URL: ${BOOKING_SERVICE_URL:-http://booking-service:8080}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8080}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8080}
      LOADTEST_SERVICE_URL: ${LOADTEST_SERVICE_URL:-http://loadtest-service:8080}
      FRONTEND_SERVICE_URL: ${FRONTEND_SERVICE_URL:-http://frontend:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # container gọi ra máy Mac
    ports:
      - "127.0.0.1:8080:8080"   # cổng vào của hệ thống
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

volumes:
  pgdata:
  redpanda-data:
  redis-data:
