# nginx phục vụ bản build tĩnh (SPA). Đứng SAU api-gateway: gateway chuyển mọi path không phải /api/** vào đây.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Healthcheck cho Docker Compose.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/** luôn do gateway route tới service; tới được đây nghĩa là route không tồn tại → 404 thật, không trả index.html.
    location /api/ {
        return 404;
    }

    # File có hash trong tên (Vite) → cache lâu.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn khác trả index.html (React Router xử lý). index.html không cache để bản mới có hiệu lực ngay.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options "DENY";
        try_files $uri /index.html;
    }
}
