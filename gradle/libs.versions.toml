# Version catalog: nơi DUY NHẤT khai báo phiên bản thư viện cho cả monorepo.
# Module dùng qua accessor, vd. `implementation(libs.spring.boot.starter.webmvc)`.

[versions]
spring-boot = "4.1.2"
spring-cloud = "2025.1.4"   # release train tương thích Spring Boot 4.0.x – 4.1.x

[libraries]
# BOM: tự quản lý version cho hàng trăm thư viện Spring/Jackson/Hibernate/Testcontainers...
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

# Gradle plugin của Spring Boot (dùng ở bước 2, trong buildSrc)
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }

# Không ghi version → lấy từ BOM
lombok = { module = "org.projectlombok:lombok" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }

# Dùng trong libs/platform-starter (auto-configuration; compileOnly – service tự mang starter của mình)
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-restclient = { module = "org.springframework.boot:spring-boot-restclient" }
spring-web = { module = "org.springframework:spring-web" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
slf4j-api = { module = "org.slf4j:slf4j-api" }

# Gateway (version từ Spring Cloud BOM)
spring-cloud-starter-gateway-server-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }

# Bảo mật (identity-service: JWT RS256, login Google; gateway: verify JWT)
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-security-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-client" }
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }

# Database
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# Event log (Redpanda – Kafka API). Transactional Outbox ở producer, consumer idempotent theo eventId.
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }

# Redis (inventory: giữ vé bằng Lua) + JDBC thuần (inventory không dùng JPA)
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }

# libs/outbox (compileOnly – service tự mang starter kafka/jdbc)
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-tx = { module = "org.springframework:spring-tx" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

# Test với Postgres thật trong Docker
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
