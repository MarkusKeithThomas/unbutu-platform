spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000   # ms – không kết nối được service trong 2s thì báo lỗi
            response-timeout: 5s    # service trả lời quá 5s thì gateway trả 504
          routes:
            - id: catalog
              uri: ${services.catalog.url}
              predicates:
                - Path=/api/catalog/**
            - id: identity
              uri: ${services.identity.url}
              predicates:
                - Path=/api/identity/**
            - id: inventory
              uri: ${services.inventory.url}
              predicates:
                - Path=/api/inventory/**
            - id: booking
              uri: ${services.booking.url}
              predicates:
                - Path=/api/bookings,/api/bookings/**
            - id: payment
              uri: ${services.payment.url}
              predicates:
                - Path=/api/payments/**
            - id: tickets                    # vé QR – nằm trong notification-service (ADR-0009)
              uri: ${services.notification.url}
              predicates:
                - Path=/api/tickets/**
            - id: loadtest                   # nút bấm load test – chỉ ADMIN (loadtest-service tự kiểm JWT)
              uri: ${services.loadtest.url}
              predicates:
                - Path=/api/loadtest/**
            # UI (SPA, nginx): mọi path còn lại. order lớn → xét SAU các route /api/** ở trên.
            - id: frontend
              uri: ${services.frontend.url}
              order: 10000
              predicates:
                - Path=/**

# Địa chỉ các service phía sau. Mặc định: tên container trong Docker network.
# Ghi đè bằng biến môi trường (vd. CATALOG_SERVICE_URL) hoặc profile local.
services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://catalog-service:8080}
  identity:
    url: ${IDENTITY_SERVICE_URL:http://identity-service:8080}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://inventory-service:8080}
  booking:
    url: ${BOOKING_SERVICE_URL:http://booking-service:8080}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8080}
  loadtest:
    url: ${LOADTEST_SERVICE_URL:http://loadtest-service:8080}
  frontend:
    url: ${FRONTEND_SERVICE_URL:http://frontend:8080}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
