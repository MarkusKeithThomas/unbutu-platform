spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000   # ms – không kết nối được service trong 2s thì báo lỗi
            response-timeout: 5s    # service trả lời quá 5s thì gateway trả 504
          routes:
            - id: catalog
              uri: ${services.catalog.url}
              predicates:
                - Path=/api/catalog/**
            - id: identity
              uri: ${services.identity.url}
              predicates:
                - Path=/api/identity/**
            - id: inventory
              uri: ${services.inventory.url}
              predicates:
                - Path=/api/inventory/**
            - id: booking
              uri: ${services.booking.url}
              predicates:
                - Path=/api/bookings,/api/bookings/**
            # UI (SPA, nginx): mọi path còn lại. order lớn → xét SAU các route /api/** ở trên.
            - id: frontend
              uri: ${services.frontend.url}
              order: 10000
              predicates:
                - Path=/**

# Địa chỉ các service phía sau. Mặc định: tên container trong Docker network.
# Ghi đè bằng biến môi trường (vd. CATALOG_SERVICE_URL) hoặc profile local.
services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://catalog-service:8080}
  identity:
    url: ${IDENTITY_SERVICE_URL:http://identity-service:8080}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://inventory-service:8080}
  booking:
    url: ${BOOKING_SERVICE_URL:http://booking-service:8080}
  frontend:
    url: ${FRONTEND_SERVICE_URL:http://frontend:8080}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
