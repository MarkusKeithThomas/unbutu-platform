spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking}
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest     # lần đầu: đọc topic từ đầu để dựng bảng giá
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Static membership (KIP-345): mỗi listener có group.instance.id cố định (booking.kafka.instance-id + hậu tố,
        # xem @KafkaListener). Deploy = tắt rồi bật lại cùng id → broker giữ nguyên partition, KHÔNG rebalance
        # (trước đây ~20–45 s đơn chậm xác nhận). Nằm ngoài nhóm > session.timeout mới bị coi là chết → chia lại.
        session.timeout.ms: 60000
    producer:                         # outbox → booking.event.v1
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    listener:
      ack-mode: record

booking:
  kafka:
    # Phải KHÁC NHAU giữa các instance chạy cùng lúc (scale N bản: booking-1..N, vd. ordinal StatefulSet);
    # 2 instance trùng id → broker "fence" bản cũ. Prod hiện 1 container → mặc định booking-1.
    instance-id: ${KAFKA_GROUP_INSTANCE_ID:booking-1}
    # Số luồng đọc payment.result.v1 (≤ 6 partition ÷ số instance). Pool DB (Hikari mặc định 10) đủ cho 3 luồng.
    payment-concurrency: ${KAFKA_PAYMENT_CONCURRENCY:3}
  jwt:
    jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:unbutu-identity}
  inventory-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8080}
  payment-url: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
  payment-grace: 5m                   # đơn đang ở cổng thanh toán: chờ thêm 5′ sau hạn giữ rồi mới EXPIRED
  hold-ttl: 10m
  max-tickets-per-user-event: 4
  service-fee-per-ticket: 10000       # VND
  expiry-interval: 5s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

outbox:
  poll-interval: 300ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
