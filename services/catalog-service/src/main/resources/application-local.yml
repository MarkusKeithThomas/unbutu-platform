# Profile "local": chạy service trực tiếp trong IntelliJ (SPRING_PROFILES_ACTIVE=local),
# hạ tầng + service khác chạy trong container và mở cổng ra localhost.
# Bảng port: README.md → "Chạy local".
server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_db
    username: catalog
    password: catalog
  data:
    redis:
      host: localhost                    # Redis trong container (127.0.0.1:6379)
  kafka:
    bootstrap-servers: localhost:19092   # Redpanda trong container (listener EXTERNAL)
  flyway:
    locations: classpath:db/migration,classpath:db/seed-local   # + dữ liệu mẫu (prod không có)

catalog:
  jwt:
    jwk-set-uri: http://localhost:8081/.well-known/jwks.json   # identity (container hoặc IntelliJ) mở cổng 8081
